[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-llm-kt"
version = "0.1.0"
description = "Prerequisite-graph enhanced LLM knowledge tracing"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["pandas>=2.0,<3"]

[project.optional-dependencies]
train = [
  "datasets>=2.18",
  "numpy>=1.26",
  "peft>=0.11",
  "scikit-learn>=1.3",
  "torch>=2.2",
  "transformers>=4.41",
  "wandb>=0.17",
]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
pgllmkt = "pgllmkt.cli:main"

[tool.setuptools.packages.find]
include = ["pgllmkt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
